# =============================================================
# Wokwi Simulator – Project Configuration
# =============================================================
# This file links the Wokwi VS Code extension to the firmware
# produced by PlatformIO.
#
# Prerequisites:
#   1. Install "Wokwi Simulator" extension in VS Code.
#   2. Compile the project:  pio run -e nano_328p
#   3. Press F1 → "Wokwi: Start Simulator"
#
# The firmware paths MUST match the PlatformIO build environment.
# Default environment: [env:nano_328p]  →  build dir: nano_328p
# =============================================================

[wokwi]
version  = 1
firmware = ".pio/build/nano_328p_wokwi/firmware.hex"
elf      = ".pio/build/nano_328p_wokwi/firmware.elf"

[[chip]]
name = "bmp280"
binary = "chips/bmp280.chip.wasm"

[[chip]]
name = "ds3231"
binary = "chips/ds3231.chip.wasm"
