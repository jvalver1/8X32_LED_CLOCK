; ============================================================
; PlatformIO Project Configuration
; 8x32 WS2812B LED Clock
; ============================================================
; Hardware:
;   - Arduino Nano (ATmega328P)
;   - 8x32 WS2812B LED Matrix
;   - BMP280 (Temperature & Pressure)
;   - DS3231 RTC
;   - 3x Push Buttons
; ============================================================

[env:nano_328p]
platform  = atmelavr
board     = nanoatmega328new
framework = arduino

; --- Build flags ---
build_flags =
    -D ENABLE_DEBUG_SERIAL  ; Enable serial debug output (comment out for release)
    -D FASTLED_AVR_LEGACY_CODE=1 ; Use stable AVR legacy code for FastLED WS2812 timing
    -D LED_DATA_PIN=6       ; WS2812B data pin
    -D NUM_LEDS=256         ; 8 x 32 = 256 LEDs
    -D MATRIX_WIDTH=32
    -D MATRIX_HEIGHT=8
    -D BTN_MODE_PIN=2       ; Button: mode selection (INT0 capable)
    -D BTN_UP_PIN=3         ; Button: increment/up   (INT1 capable)
    -D BTN_DOWN_PIN=4       ; Button: decrement/down
    -D BMP280_I2C_ADDR=0x76 ; BMP280 I2C address (0x76 or 0x77 depending on SDO pin)

; --- Library dependencies ---
lib_deps =
    fastled/FastLED @ 3.6.0
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit BusIO @ ^1.16.1

; --- Serial monitor ---
monitor_speed = 115200
monitor_filters = send_on_enter, colorize

; --- Upload settings ---
upload_speed = 115200

; --- Optimization ---
build_type = debug   ; Change to 'release' for production

; ============================================================
; Release environment (comment out build flags for debug)
; ============================================================
[env:nano_328p_release]
extends      = env:nano_328p
build_type   = release
build_flags  =
    -D LED_DATA_PIN=6
    -D NUM_LEDS=256
    -D MATRIX_WIDTH=32
    -D MATRIX_HEIGHT=8
    -D BTN_MODE_PIN=2
    -D BTN_UP_PIN=3
    -D BTN_DOWN_PIN=4
    -D BMP280_I2C_ADDR=0x76

; ============================================================
; Wokwi Simulation environment
; ============================================================
; This environment produces the firmware.hex + firmware.elf
; consumed by Wokwi (wokwi.toml points here).
; Build: pio run -e nano_328p_wokwi
; Then:  F1 → "Wokwi: Start Simulator" in VS Code
; ============================================================
[env:nano_328p_wokwi]
extends     = env:nano_328p
build_type  = release
build_flags =
    -D ENABLE_DEBUG_SERIAL
    -D FASTLED_AVR_LEGACY_CODE=1
    -D LED_DATA_PIN=6
    -D NUM_LEDS=256
    -D MATRIX_WIDTH=32
    -D MATRIX_HEIGHT=8
    -D BTN_MODE_PIN=2
    -D BTN_UP_PIN=3
    -D BTN_DOWN_PIN=4
    -D BMP280_I2C_ADDR=0x76
    -D WOKWI_SIMULATION       ; Set by simulation env – can gate sim-specific code
    -D SENSOR_POLL_MS=2000    ; Poll faster in simulation (no real sensor lag)
    -D AUTO_SCROLL_DURATION_MS=3000
