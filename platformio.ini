; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; The hardware release is the sole default so `run --target upload` can never
; attempt to upload the simulation environment. A release-only post-build hook
; builds Wokwi as well when the command is a normal `platformio run`.
default_envs = pro_mini_328p_release

[env:pro_mini_328p_release]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
build_type = release
build_flags =
	-D FASTLED_AVR_LEGACY_CODE=1
	-D LED_DATA_PIN=6
	-D NUM_LEDS=256

	-D MATRIX_WIDTH=32
	-D MATRIX_HEIGHT=8
	-D MATRIX_LAYOUT=0
	-D BTN_MODE_PIN=3
	-D BTN_UP_PIN=4
	-D BTN_DOWN_PIN=5
	-D BME280_I2C_ADDR=0x76
lib_deps =
	fastled/FastLED @ 3.7.0
	adafruit/Adafruit BME280 Library @ ^2.3.0
	adafruit/RTClib @ ^2.1.4
	adafruit/Adafruit BusIO @ ^1.16.1
monitor_speed = 115200
monitor_filters = send_on_enter, colorize
upload_speed = 57600
extra_scripts = post:scripts/build_wokwi.py

[env:nano_328p_wokwi]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_type = release
build_flags =
	-D ENABLE_DEBUG_SERIAL
	-D FASTLED_AVR_LEGACY_CODE=1
	-D LED_DATA_PIN=6
	-D NUM_LEDS=256
	-D MATRIX_WIDTH=32
	-D MATRIX_HEIGHT=8
	-D MATRIX_LAYOUT=2
	-D BTN_MODE_PIN=3
	-D BTN_UP_PIN=4
	-D BTN_DOWN_PIN=5
	-D BME280_I2C_ADDR=0x76
	-D WOKWI_SIMULATION
	-D SENSOR_POLL_MS=2000
	-D MIN_BRIGHTNESS=26
	-D MAX_BRIGHTNESS=255
lib_deps =
	adafruit/Adafruit BME280 Library @ ^2.3.0
	adafruit/RTClib @ ^2.1.4
	adafruit/Adafruit BusIO @ ^1.16.1
	fastled/FastLED@3.7.0
monitor_speed = 115200
monitor_filters = send_on_enter, colorize
